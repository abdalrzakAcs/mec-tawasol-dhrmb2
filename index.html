<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#ff6b35">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}*,*::before,*::after{box-sizing:inherit}body{margin:0;padding:0;font:14px sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>ناشرين وممثلين لماي اكزامس</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* التخطيط: شريط هوية برتقالي فيه خمس بطاقات أقسام حسب «شو منعمل معهم»؛ تحته شريط لاصق: بحث + الكلية + الجامعة + فلاتر جاهزية؛ المحتوى شبكة بطاقات بيضاء مقسومة حسب الجامعة، والمتعاقدين معها أول شي. هوية ماي اكزامس: أبيض + برتقالي واحد، خطوط خفيفة، بلا غمقان */
:root{
  color-scheme: light;
  --bg:#fbf8f6; --card:#ffffff; --ink:#333333; --muted:#6f6a67;
  --line:#efe6e0; --line-2:#f6eee9;
  --brand:#ff6b35; --brand-2:#ff8f5e; --brand-ink:#c2410c; --tint:#fff3ec; --tint-2:#ffe6d9;
  --ok:#2f855a; --ok-tint:#ecf8f1; --warn:#946200; --warn-tint:#fff6e3;
  --shadow:0 1px 2px rgba(120,60,30,.06),0 6px 20px rgba(120,60,30,.06);
  --font-head:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --font-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;padding-block:0 56px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:#fff}

.hero{background:linear-gradient(135deg,var(--brand) 0%,var(--brand-2) 100%);color:#fff;padding-block:24px 20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:auto -80px -140px auto;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.hero .wrap{display:grid;gap:14px;position:relative;z-index:1}
.brandline{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:500;font-size:14px;opacity:.95}
.brandline .dot{width:30px;height:30px;border-radius:9px;background:#fff;color:var(--brand);display:grid;place-items:center;font-weight:600}
.hero h1{margin:0;font-family:var(--font-head);font-weight:600;font-size:clamp(23px,4vw,32px);line-height:1.3;text-wrap:balance}
.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}
.tab{all:unset;cursor:pointer;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:11px 13px;display:grid;gap:1px;transition:background .15s;min-width:0}
.tab:hover{background:rgba(255,255,255,.24)}
.tab .n{font-family:var(--font-head);font-size:24px;font-weight:600;line-height:1.15;font-variant-numeric:tabular-nums}
.tab .l{font-size:13.5px;font-weight:500}
.tab .s{font-size:12px;opacity:.88;line-height:1.45}
.tab[aria-selected="true"]{background:#fff;color:var(--brand-ink);border-color:#fff;box-shadow:0 6px 18px rgba(150,60,20,.18)}
.tab[aria-selected="true"] .s{color:var(--muted);opacity:1}
.tab:focus-visible{outline:2px solid #fff;outline-offset:2px}

.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);padding-block:10px}
.toolbar .wrap{display:grid;gap:8px}
.actionbar{padding-block:12px 0}
.action{margin:0;font-size:14px;color:var(--ink);background:var(--tint);border:1px solid var(--tint-2);border-radius:11px;padding:7px 12px}
.action b{color:var(--brand-ink);font-weight:500}
.searchrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 260px;position:relative;min-width:0}
.search input{width:100%;box-sizing:border-box;font:inherit;padding:8px 38px 8px 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--tint-2)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:var(--muted)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row .lab{flex:none;font-size:12.5px;color:var(--muted);width:52px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;scrollbar-width:thin;min-width:0;flex:1}
.pill{all:unset;cursor:pointer;font-size:13px;padding:3px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);white-space:nowrap;flex:none}
.pill .c{color:var(--muted);font-variant-numeric:tabular-nums}
.pill.ours{border-color:var(--tint-2);background:var(--tint)}
.pill[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.pill[aria-pressed="true"] .c{color:#fff}
.pill:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.tog[aria-pressed="true"]{background:var(--tint);border-color:var(--brand);color:var(--brand-ink)}
.count{color:var(--muted);font-size:13px;margin:0}

main{padding-block:6px 0}
section.uni{margin-top:26px}
.sechead{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sechead h2{margin:0;font-family:var(--font-head);font-weight:500;font-size:20px}
.badge{font-size:12.5px;background:var(--line-2);color:var(--muted);border-radius:999px;padding:1px 10px;font-variant-numeric:tabular-nums}
.badge.ours{background:var(--tint);color:var(--brand-ink)}
.sechead .rule{flex:1;height:1px;background:linear-gradient(to left,var(--tint-2),transparent);min-width:30px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 11px;display:flex;flex-direction:column;gap:8px;min-width:0;transition:box-shadow .15s,border-color .15s}
.card:hover{box-shadow:var(--shadow);border-color:#f1dfd5}
.card.start{border-top:3px solid var(--brand)}
.card.done{opacity:.55}
.card h3{margin:0;font-size:16px;font-weight:600;line-height:1.5;overflow-wrap:anywhere}
.tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:12px;padding:1px 9px;border-radius:999px;background:var(--line-2);color:var(--muted);white-space:nowrap}
.tag.start{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.tag.check{background:var(--warn-tint);color:var(--warn)}
.tag.rep{background:var(--ok-tint);color:var(--ok)}
.tag.ours{background:var(--tint);color:var(--brand-ink)}
.tag.pt{background:#fff;border:1px solid var(--line);color:var(--ink)}
.where{color:var(--muted);font-size:13.5px;margin:0}
.kv{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.contact{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.num{font-family:var(--font-mono);direction:ltr;unicode-bidi:isolate;font-size:13.5px;font-variant-numeric:tabular-nums;user-select:all}
.phone{display:inline-flex;align-items:center;gap:6px;background:var(--tint);border:1px solid var(--tint-2);border-radius:10px;padding:3px 4px 3px 10px}
.phone .note{font-size:12px;color:var(--muted)}
.copy{all:unset;cursor:pointer;font-size:12px;background:#fff;color:var(--brand-ink);border:1px solid var(--tint-2);border-radius:7px;padding:1px 8px}
.copy:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.copy:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.tg{display:inline-flex;align-items:center;gap:6px;background:#f2f7fb;border:1px solid #e1edf6;border-radius:10px;padding:3px 10px;color:#1f6f9f;text-decoration:none}
.notes{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px dashed var(--line);padding-top:8px}
details{font-size:13.5px;min-width:0;flex:1}
details summary{cursor:pointer;color:var(--brand-ink);list-style:none;display:inline-flex;align-items:center;gap:4px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"⌄";font-size:13px;transition:transform .15s}
details[open] summary::after{transform:rotate(180deg)}
details .kv{margin-top:8px;font-size:13.5px}
details a{color:var(--brand-ink)}
.done-btn{all:unset;cursor:pointer;font-size:12.5px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted);white-space:nowrap}
.done-btn[aria-pressed="true"]{background:var(--ok-tint);border-color:#cfeedd;color:var(--ok)}
.done-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.empty{color:var(--muted);padding:30px 0;text-align:center}

.adnote{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:var(--muted);font-size:14px;display:flex;gap:12px;align-items:flex-start}
.adnote .ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--tint);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--font-head)}
.adgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px;margin-top:14px}
.verdict{margin:0;color:var(--brand-ink);font-size:14px}
.stats{display:flex;flex-wrap:wrap;gap:6px}
.stats span{font-size:12.5px;background:var(--line-2);border-radius:8px;padding:2px 9px;font-variant-numeric:tabular-nums}
.subt{margin:2px 0 0;font-size:13px;color:var(--muted);font-weight:500}
.adv{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.adv li{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:start;padding:7px 10px;border-radius:10px;background:var(--bg)}
.adv .c{grid-row:span 2;font-family:var(--font-head);font-size:12px;background:var(--tint);color:var(--brand-ink);border-radius:8px;padding:2px 8px;white-space:nowrap;align-self:center}
.adv b{font-weight:500;font-size:14px}
.adv small{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.footer{margin-top:40px;color:var(--muted);font-size:13px;display:grid;gap:6px;max-width:80ch}
.totop{all:unset;cursor:pointer;position:fixed;z-index:15;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:calc(16px + env(safe-area-inset-left,0px));background:var(--brand);color:#fff;font-size:13.5px;padding:8px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(150,60,20,.25)}
.totop:focus-visible{outline:2px solid var(--brand-ink);outline-offset:2px}
@media (max-width:900px){ .tabs{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:640px){
  body{font-size:14.5px}
  .hero{padding-block:18px 14px}
  .hero h1{font-size:21px}
  .brandline{font-size:13px}.brandline .dot{width:26px;height:26px}
  .tabs{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:8px;padding-bottom:4px;margin-inline:-4px;padding-inline:4px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;min-width:118px;padding:8px 11px;scroll-snap-align:start}
  .tab .n{font-size:19px}.tab .l{font-size:12.5px;white-space:nowrap}.tab .s{display:none}
  .actionbar{padding-block:10px 0}
  .action{font-size:13px;padding:7px 10px}
  .toolbar{position:static;padding-block:10px 6px;background:var(--bg);border-bottom:0}
  .search{flex-basis:100%}
  #toggles{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  #toggles::-webkit-scrollbar{display:none}
  .row .lab{display:none}
  .count{font-size:12.5px}
  section.uni{margin-top:20px}
  .sechead h2{font-size:18px}
  .grid,.adgrid{grid-template-columns:1fr;gap:10px}
  .card{padding:13px 13px 10px;border-radius:14px}
  .kv{grid-template-columns:1fr;gap:1px}.kv dt{margin-top:4px;font-size:13px}
  .phone{padding:3px 4px 3px 8px}
  .adv li{padding:7px 8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  if (l.tier === 'check') tags.push('<span class="tag check">تأكد قبل</span>');
  if (OURS.has(l.uni)) tags.push('<span class="tag ours">جامعة متعاقدين معها</span>');
  if (cat === 'publishers' && l.rep_candidate) tags.push('<span class="tag rep">مرشح ممثل</span>');
  if (cat === 'reps' && l.rep_from_seller) tags.push('<span class="tag rep">طالب بيبيع ملفات</span>');
  if (l.kind) tags.push(`<span class="tag">${esc(l.kind)}</span>`);
  (l.ptypes || []).forEach(p => tags.push(`<span class="tag pt">${esc(p)}</span>`));
  const aud = l.audience ? String(l.audience).split('؛')[0] : '';
  const where = [l.fac !== 'كل الكليات' ? l.faculty : (l.faculty || 'كل الكليات'), aud].filter(Boolean).join(' · ');
  return `<article class="card${l.tier==='start'?' start':''}${isDone?' done':''}">
    <div class="tags">${tags.join('')}</div>
    <h3>${esc(l.name)}</h3>
    ${where?`<p class="where">${esc(where)}</p>`:''}
    ${contact?`<div class="contact">${contact}</div>`:`<p class="where">التواصل: ${esc(l.other_contact || 'من رابط المصدر')}</p>`}
    <dl class="kv">${kv('المواد', esc(l.subjects))}${kv(cat==='reps'||cat==='venues'?'الدور':'شو بيبيع', esc(l.what_they_sell))}${kv('السعر', esc(l.price))}</dl>
    ${l.notes?`<p class="notes">${esc(l.notes)}</p>`:''}
    <div class="foot">
      <details><summary>التفاصيل والمصدر</summary>
        <dl class="kv">${kv('الجامعة', esc(l.university))}${phones.length < splitPhones(l.phone).length ? kv('أرقام تانية', esc(splitPhones(l.phone).slice(4).join(' / '))) : ''}${kv('تواصل تاني', esc(l.other_contact))}${kv('وين عم ينباع', esc(l.sold_where))}${kv('التاريخ', esc(l.date_seen))}${kv('الجمهور', esc(l.audience))}${kv('ملاحظة كاملة', esc(l.notes))}${kv('شفته هون', `<a href="${esc(l.source_url)}" target="_blank" rel="noopener">${esc(l.source_label||'المصدر')}</a>`)}</dl>
      </details>
      <button class="done-btn" type="button" aria-pressed="${isDone}" data-done="${esc(l.id)}">${isDone?'حكيناه ✓':'حكيناه؟'}</button>
    </div>
  </article>`;
}

function adCard(v){
  const contacts = v.contact ? v.contact.split(/\s*\/\s*/).map(c => /^@/.test(c) ? tgHtml(c) : phoneHtml(c)).join('') : '';
  return `<article class="card start">
    <div class="tags"><span class="tag start">${esc(v.best_for)}</span></div>
    <h3>${esc(v.name)}</h3>
    <p class="verdict">${esc(v.verdict)}</p>
    <div class="stats">${v.stats.map(s => `<span>${esc(s)}</span>`).join('')}</div>
    ${contacts?`<div class="contact">${contacts}</div>`:''}
    <p class="where">${esc(v.contact_note)}</p>
    <p class="subt">مين عم يعلن عندهن</p>
    <ul class="adv">${v.advertisers.map(a => `<li><span class="c">${esc(a.count)}</span><b>${esc(a.who)}</b><small>${esc(a.when)} · مشاهدات ${esc(a.views)}</small></li>`).join('')}</ul>
    ${v.notes?`<p class="notes" style="-webkit-line-clamp:unset">${esc(v.notes)}</p>`:''}
    <div class="foot"><a class="tg" href="${esc(v.link)}" target="_blank" rel="noopener"><span class="num">${esc(v.link.replace(/^https?:\/\//,''))}</span></a></div>
  </article>`;
}

function render(){
  renderChips();
  const rows = baseRows();
  const list = $('#list'); list.innerHTML = '';
  const q = $('#q').value.trim().toLowerCase();
  if (cat === 'venues' && uniF === 'الكل' && facF === 'الكل' && !F.start && !F.phone && !F.done){
    const ads = ADSDATA.venues.filter(v => !q || JSON.stringify(v).toLowerCase().includes(q));
    if (ads.length){
      const sec = document.createElement('section'); sec.className = 'uni';
      sec.innerHTML = `<div class="sechead"><h2>الأقوى للإعلان</h2><span class="badge ours">${AR(ads.length)}</span><span class="rule"></span></div><div class="adnote"><span class="ic">!</span><div>${esc(ADSDATA.note)}</div></div><div class="adgrid">${ads.map(adCard).join('')}</div>`;
      list.appendChild(sec);
    }
  }
  $('#count').textContent = `عم يبيّن ${AR(rows.length)} · منهم ${AR(rows.filter(l=>l.tier==='start').length)} جاهزين للتواصل · ${AR(rows.filter(l=>l.phone||l.telegram).length)} إلهم رقم أو حساب`;
  if (!rows.length){ if (!list.children.length) list.innerHTML = '<p class="empty">ما في نتائج بهالفلتر. جرّب تشيل البحث أو اختار «الكل».</p>'; return; }
  [...new Set(rows.map(l => l.uni))].sort(uniSort).forEach(u => {
    const g = rows.filter(l => l.uni === u);
    const sec = document.createElement('section'); sec.className = 'uni';
    sec.innerHTML = `<div class="sechead"><h2>${esc(u)}</h2>${OURS.has(u)?'<span class="badge ours">متعاقدين معها</span>':''}<span class="badge">${AR(g.length)}</span><span class="rule"></span></div><div class="grid">${g.map(card).join('')}</div>`;
    list.appendChild(sec);
  });
}

document.addEventListener('click', e => {
  const c = e.target.closest('[data-copy]');
  if (c){
    const v = c.dataset.copy;
    const ok = () => { c.textContent = 'انتسخ'; setTimeout(() => c.textContent = 'نسخ', 1400); };
    const fallback = () => { const n = c.parentElement.querySelector('.num'); const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); c.textContent = 'محدد'; setTimeout(() => c.textContent = 'نسخ', 1800); };
    try { navigator.clipboard.writeText(v).then(ok).catch(fallback); } catch(err) { fallback(); }
    return;
  }
  const d = e.target.closest('[data-done]');
  if (d){ const id = d.dataset.done; doneSet.has(id) ? doneSet.delete(id) : doneSet.add(id); store('mec-leads-done', JSON.stringify([...doneSet])); render(); return; }
  const t = e.target.closest('.tab');
  if (t){ cat = t.dataset.cat; store('mec-leads-cat', cat); uniF = 'الكل'; facF = 'الكل'; F.rep = false; $('#f-rep').setAttribute('aria-pressed','false'); renderTabs(); render(); window.scrollTo({top:0, behavior:'smooth'}); return; }
  const f = e.target.closest('[data-fac]'); if (f){ facF = f.dataset.fac; render(); return; }
  const u = e.target.closest('[data-uni]'); if (u){ uniF = u.dataset.uni; render(); return; }
});
[['f-start','start'],['f-phone','phone'],['f-rep','rep'],['f-done','done']].forEach(([id,k]) => {
  $('#'+id).addEventListener('click', () => { F[k] = !F[k]; $('#'+id).setAttribute('aria-pressed', String(F[k])); render(); });
});
$('#q').addEventListener('input', render);
$('#footNote').textContent = META.note || '';
$('#updated').textContent = META.updated || '';
const tt = $('#totop');
window.addEventListener('scroll', () => { tt.hidden = window.scrollY < 900; }, {passive:true});
tt.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
renderTabs(); render();
</script>

</body>
</html>
